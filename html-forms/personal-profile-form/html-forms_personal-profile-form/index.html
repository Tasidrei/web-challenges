<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Personal Profile Form</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <form>
      <fieldset>
        <p id="description"> 
      We want to get to know you! Please enter your personal information.</p>
    <legend>Personal Information</legend>
       <label for="firstname"> First Name</label>
       <input type="text" id="firstName" required/>

       <label for="lastname"> Last Name</label>
       <input type="text" id="lastName" required/>

       <label for="date">Your Birthday</label>
       <input type="date" id="date" required />
       
       <label for="color">Color</label>
       <input type="color" id="color" name="color" value="#E5430F" />
       <label for="petfavorites"> Choose your favorite pet</label>
    <select id="select-favorite-pets">
      <option value="cat">Cat</option>
      <option value="dog">Dog</option>
      <option value="pig">Pig</option>
      <option value="turtle">Turtle</option>
      <option value="chicken">Chicken</option>
    </select>
      </fieldset>
    </form>
  </body>
</html>
